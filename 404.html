<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        id="theme-color"
        name="theme-color"
        content="#168de2"
    >

    <title id="titulo-pagina">
        404 — mariobnw quest
    </title>

    <link
        id="favicon"
        rel="icon"
        type="image/png"
        href="images/favicon-aberto.png"
    >


    <style>

        :root {
            --tema: #168de2;
            --tema-rgb: 22, 141, 226;

            --fundo-1: #050505;
            --fundo-2: #101521;

            --texto: #ffffff;
            --texto-secundario: #9ca1ab;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            margin: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            padding: 30px;

            background:
                radial-gradient(
                    circle at 50% 25%,
                    rgba(
                        var(--tema-rgb),
                        .16
                    ),
                    transparent 38%
                ),
                linear-gradient(
                    155deg,
                    var(--fundo-2),
                    var(--fundo-1)
                );

            color: var(--texto);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            text-align: center;

            transition:
                background .5s ease;
        }


        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: .45;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,.012) 0px,
                    rgba(255,255,255,.012) 1px,
                    transparent 1px,
                    transparent 4px
                );
        }


        main {
            position: relative;

            width: min(720px, 100%);

            display: flex;

            flex-direction: column;

            align-items: center;

            z-index: 2;
        }


        /* ==============================
           LOGO
        ============================== */

        #logo {
            max-width: 330px;
            max-height: 80px;

            margin-bottom: 42px;

            object-fit: contain;

            transition:
                transform .2s ease,
                filter .2s ease;
        }


        /* ==============================
           NÚMERO
        ============================== */

        .numero {
            position: relative;

            color: var(--tema);

            font-size:
                clamp(
                    110px,
                    28vw,
                    235px
                );

            font-weight: 900;

            letter-spacing: -12px;

            line-height: .78;

            text-shadow:
                0 0 45px
                rgba(
                    var(--tema-rgb),
                    .25
                );

            user-select: none;
        }


        .numero::before,
        .numero::after {
            content:
                attr(data-numero);

            position: absolute;

            inset: 0;

            opacity: 0;

            pointer-events: none;
        }


        /* ==============================
           TEXTO
        ============================== */

        h1 {
            margin:
                45px 0 12px;

            font-size:
                clamp(
                    27px,
                    5vw,
                    42px
                );

            line-height: 1.15;
        }


        #texto {
            max-width: 560px;

            margin: 0;

            color:
                var(--texto-secundario);

            font-size: 16px;

            line-height: 1.7;

            white-space: pre-line;
        }


        /* ==============================
           BOTÃO
        ============================== */

        #voltar {
            margin-top: 32px;

            padding:
                14px 26px;

            background:
                var(--tema);

            color:
                white;

            border-radius:
                12px;

            text-decoration: none;

            font-weight: bold;

            box-shadow:
                0 10px 35px
                rgba(
                    var(--tema-rgb),
                    .22
                );

            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }


        #voltar:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 14px 40px
                rgba(
                    var(--tema-rgb),
                    .32
                );
        }


        /* ==============================
           MARIO.UNO
        ============================== */

        body.tema-uno {
            --tema: #39bd60;
            --tema-rgb: 57, 189, 96;

            --fundo-1: #030905;
            --fundo-2: #102819;
        }


        /* ==============================
           MARIOBNE
        ============================== */

        body.tema-bne {
            --tema: #df2943;
            --tema-rgb: 223, 41, 67;

            --fundo-1: #030000;
            --fundo-2: #26060d;
        }


        body.tema-bne .numero {
            animation:
                bneNumeroBase
                3.2s
                infinite;
        }


        body.tema-bne .numero::before {
            color: #ff1744;

            animation:
                camadaVermelha
                3.2s
                infinite;
        }


        body.tema-bne .numero::after {
            color: #00d9ff;

            animation:
                camadaAzul
                3.2s
                infinite;
        }


        @keyframes bneNumeroBase {

            0%,
            86%,
            100% {
                transform: none;
                filter: none;
            }

            88% {
                transform:
                    translate(-5px, 1px)
                    skewX(-3deg);
            }

            91% {
                transform:
                    translate(6px, -2px)
                    skewX(4deg);

                filter:
                    contrast(1.5);
            }

            94% {
                transform:
                    translate(-3px, 2px);
            }

            97% {
                transform: none;
            }

        }


        @keyframes camadaVermelha {

            0%,
            86%,
            100% {
                opacity: 0;
            }

            88% {
                opacity: .55;

                transform:
                    translate(-7px, 0);

                clip-path:
                    inset(
                        12% 0 58% 0
                    );
            }

            92% {
                opacity: .7;

                transform:
                    translate(5px, 2px);

                clip-path:
                    inset(
                        55% 0 15% 0
                    );
            }

            96% {
                opacity: 0;
            }

        }


        @keyframes camadaAzul {

            0%,
            87%,
            100% {
                opacity: 0;
            }

            89% {
                opacity: .45;

                transform:
                    translate(6px, -1px);

                clip-path:
                    inset(
                        60% 0 8% 0
                    );
            }

            93% {
                opacity: .6;

                transform:
                    translate(-5px, 1px);

                clip-path:
                    inset(
                        20% 0 55% 0
                    );
            }

            97% {
                opacity: 0;
            }

        }


        body.tema-bne #logo {
            animation:
                bneLogo
                4.7s
                infinite;
        }


        @keyframes bneLogo {

            0%,
            91%,
            100% {
                transform: none;
                filter: none;
            }

            93% {
                transform:
                    translateX(-3px);

                filter:
                    drop-shadow(
                        4px 0 #ff193c
                    );
            }

            95% {
                transform:
                    translateX(4px);

                filter:
                    drop-shadow(
                        -4px 0 #00d5ff
                    );
            }

            97% {
                transform: none;
            }

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            body {
                padding: 22px;
            }


            #logo {
                max-width: 250px;

                margin-bottom: 35px;
            }


            .numero {
                letter-spacing: -7px;
            }


            h1 {
                margin-top: 35px;
            }

        }

    </style>

</head>


<body>

    <main>

        <img
            id="logo"
            src="images/logo-topo.png"
            alt="mariobnw quest"
        >


        <div
            id="numero"
            class="numero"
            data-numero="404"
        >
            404
        </div>


        <h1 id="titulo">
            Essa página não existe.
        </h1>


        <p id="texto">
            Talvez você tenha encontrado uma parte
            do Quest que ainda não foi criada.
        </p>


        <a
            id="voltar"
            href="./"
        >
            Voltar ao início
        </a>

    </main>


    <script>

        /* ==============================
           CAMINHO DO GITHUB PAGES
        ============================== */

        const partes =
            location.pathname
                .split("/")
                .filter(Boolean);


        const base =
            location.hostname.endsWith(
                "github.io"
            )

            ?

            (
                partes.length
                ?
                "/"
                +
                partes[0]
                +
                "/"

                :

                "/"
            )

            :

            "/";


        /* ==============================
           ESTADO
        ============================== */

        const tema =
            localStorage.getItem(
                "bnwTema"
            )
            ||
            "mariobnw";


        const idioma =
            localStorage.getItem(
                "bnwIdioma"
            )
            ||
            "pt";


        const numero =
            document.getElementById(
                "numero"
            );


        const titulo =
            document.getElementById(
                "titulo"
            );


        const texto =
            document.getElementById(
                "texto"
            );


        const logo =
            document.getElementById(
                "logo"
            );


        const favicon =
            document.getElementById(
                "favicon"
            );


        const themeColor =
            document.getElementById(
                "theme-color"
            );


        const tituloPagina =
            document.getElementById(
                "titulo-pagina"
            );


        const voltar =
            document.getElementById(
                "voltar"
            );


        voltar.href =
            base;


        /* ==============================
           MARIOBNW
        ============================== */

        if (
            tema ===
            "mariobnw"
        ) {

            numero.textContent =
                "404";

            numero.dataset.numero =
                "404";


            logo.src =
                base
                +
                "images/logo-topo.png";


            favicon.href =
                base
                +
                "images/favicon-aberto.png";


            themeColor.content =
                "#168de2";


            if (
                idioma === "en"
            ) {

                titulo.textContent =
                    "This page doesn't exist.";

                texto.textContent =
                    "Maybe you found a part of the Quest that hasn't been created yet.";

                voltar.textContent =
                    "Return home";

            }

            else {

                titulo.textContent =
                    "Essa página não existe.";

                texto.textContent =
                    "Talvez você tenha encontrado uma parte do Quest que ainda não foi criada.";

            }

        }


        /* ==============================
           MARIO.UNO
        ============================== */

        if (
            tema ===
            "mario.uno"
        ) {

            document.body.classList.add(
                "tema-uno"
            );


            numero.textContent =
                "404";

            numero.dataset.numero =
                "404";


            logo.src =
                base
                +
                "images/logo-topo-verde.png";


            favicon.href =
                base
                +
                "images/mariobnw-verde-aberto.png";


            themeColor.content =
                "#39bd60";


            tituloPagina.textContent =
                "404 — mario.uno quest";


            if (
                idioma === "en"
            ) {

                titulo.textContent =
                    "You weren't supposed to end up here.";

                texto.textContent =
                    "Go back before something notices.";

                voltar.textContent =
                    "Go back";

            }

            else {

                titulo.textContent =
                    "Você não devia ter parado aqui.";

                texto.textContent =
                    "Melhor voltar antes que alguma coisa perceba.";

                voltar.textContent =
                    "Voltar";

            }

        }


        /* ==============================
           MARIOBNE
        ============================== */

        if (
            tema ===
            "mariobne"
        ) {

            document.body.classList.add(
                "tema-bne"
            );


            /*
                Visualmente vira 303.
                O HTTP real continua sendo 404.
            */

            numero.textContent =
                "303";

            numero.dataset.numero =
                "303";


            logo.src =
                base
                +
                "images/logo-topo-bne.png";


            favicon.href =
                base
                +
                "images/favicon-bne-aberto.png";


            themeColor.content =
                "#df2943";


            tituloPagina.textContent =
                "303 — mariobne quest";


            if (
                idioma === "en"
            ) {

                titulo.textContent =
                    "This page was here.";

                texto.textContent =
                    "Now it isn't.\n\nIt wasn't me.\n...probably.";

                voltar.textContent =
                    "Leave";

            }

            else {

                titulo.textContent =
                    "Essa página estava aqui.";

                texto.textContent =
                    "Agora não está mais.\n\nNão fui eu.\n...provavelmente.";

                voltar.textContent =
                    "Sair daqui";

            }

        }


        /* ==============================
           FALLBACK DA LOGO
        ============================== */

        logo.onerror =
            function() {

                logo.onerror =
                    null;


                logo.src =
                    base
                    +
                    "images/logo-topo.png";

            };

    </script>

</body>

</html>
